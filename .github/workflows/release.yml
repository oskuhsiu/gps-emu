name: Android release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        id: version
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v?(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo '::error::Use a release tag such as v1.2.3 or 1.2.3.'
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          if (( major > 2099 )); then
            echo '::error::Major version must be <= 2099; minor and patch must be <= 999.'
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch + 1))
          commit_sha=$(git rev-parse HEAD)
          printf 'version_name=%s.%s.%s\nversion_code=%s\ncommit_sha=%s\n' \
            "$major" "$minor" "$patch" "$version_code" "$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify public test keystore
        run: sha256sum --check signing/public-test.jks.sha256

      - name: Install Android build packages
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;35.0.0'

      - name: Test, lint, and build release
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            :core:test :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease \
            -PreleaseVersionName="$VERSION_NAME" -PreleaseVersionCode="$VERSION_CODE"
          python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Align, sign, and verify APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          # Intentionally public test credentials; see signing/README.md.
          PUBLIC_TEST_PASSWORD: public-test-password
        run: |
          set -euo pipefail
          umask 077
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p release-assets
          "$build_tools/zipalign" -P 16 -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          apk="release-assets/route-mock-${VERSION_NAME}-release.apk"
          "$build_tools/apksigner" sign --ks signing/public-test.jks --ks-key-alias route-mock-public-test \
            --ks-pass env:PUBLIC_TEST_PASSWORD --key-pass env:PUBLIC_TEST_PASSWORD \
            --v4-signing-enabled false --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          (cd release-assets && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Store verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          path: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release
          path: release-assets

      - name: Publish GitHub Release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit_sha }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$remote_commit" != "$BUILD_COMMIT" ]]; then
            echo '::error::The tag moved after the build. Refusing to publish mismatched artifacts.'
            exit 1
          fi
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo '::error::This tag already has a published release. Push a new version tag.'
              exit 1
            fi
          else
            cat > "$RUNNER_TEMP/public-signing-notice.md" <<'NOTICE'
          **Public test signing key:** this release APK uses a keystore and password
          intentionally published in this repository. Anyone can sign an APK with
          the same identity, so its certificate does not prove publisher authenticity.
          Download the APK from this repository's Releases page. The key is reused
          across versions for test-installation updates; it is not a production key.
          NOTICE
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --target "$BUILD_COMMIT" --title "Route Mock $VERSION_NAME (public test key)" \
              --generate-notes --notes-file "$RUNNER_TEMP/public-signing-notice.md" --draft
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "route-mock-${VERSION_NAME}-release.apk" SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
