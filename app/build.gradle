plugins { id 'com.android.application' }
android {
    namespace 'dev.routemock.app'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.routemock.app'
        minSdk 28
        targetSdk 36
        versionCode providers.gradleProperty('releaseVersionCode').map { it.toInteger() }.getOrElse(2001)
        versionName providers.gradleProperty('releaseVersionName').getOrElse('0.2.0')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    lint { abortOnError true }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':core')
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260522'
}
